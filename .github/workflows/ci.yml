name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Check build output (dist 內要有三個頁面與星空 chunk)
        run: |
          test -f dist/index.html
          test -f dist/solutions/index.html
          test -f dist/contact/index.html
          # Three.js 星空必須是獨立的 lazy chunk，不能被打進首屏 bundle
          ls dist/_astro | grep -q '^starfield-gl\..*\.js$'
          # 所有站內資源都要帶 GitHub Pages 的 base path
          grep -q '/demo-claude-in-slack/_astro/' dist/index.html
